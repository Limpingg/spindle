[package]
name = "spindle-setup"
version = "0.14.102"
edition = "2024"
description = "Installs Spindle for the current user"
license = "MIT"
publish = false

[[bin]]
name = "spindle-setup"
path = "src/main.rs"

[build-dependencies]
flate2 = "1"

[dependencies]
flate2 = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
