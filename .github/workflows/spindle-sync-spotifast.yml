# Every day, brings the newest Spotifast release into Spindle and releases
# it, so Spindle on Nick's PC updates itself within a day of Spotifast.
#
# scripts/sync-spotifast.sh does the merge (rename, then merge, see
# scripts/rename-upstream.py). A clean merge is pushed to main with the
# spotifast-renamed branch, then the Release workflow is dispatched for
# the new version. A merge with conflicts is left alone: an issue lists the
# files, and a person (or Claude) resolves it with the script by hand.

name: Sync Spotifast

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Spotifast tag to merge (empty: the newest release)"
        required: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch the renamed branch and Spotifast
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin spotifast-renamed:spotifast-renamed
          git remote add upstream https://github.com/crmne/spotifast.git
          git fetch --no-tags upstream '+refs/tags/v*:refs/tags/spotifast/v*' 
      - name: Merge the release
        id: merge
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set +e
          before=$(git rev-parse HEAD)
          output=$(bash scripts/sync-spotifast.sh $INPUT_TAG 2>&1)
          status=$?
          set -e
          echo "$output"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          delimiter="spindle-$(date +%s%N)"
          {
            echo "output<<$delimiter"
            echo "$output"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          if [ "$status" = "0" ] && [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Check the merge compiles
        if: steps.merge.outputs.merged == 'true'
        id: check
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: x86_64-pc-windows-gnu
      - name: Compile check for Windows
        if: steps.merge.outputs.merged == 'true'
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          cargo zigbuild --locked --release --no-default-features --target x86_64-pc-windows-gnu
      - name: Push and release
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.merge.outputs.version }}
        run: |
          set -euo pipefail
          git push origin main spotifast-renamed
          gh workflow run spindle-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=v$VERSION"
          echo "Spindle $VERSION is on its way: the Release workflow was started."
      - name: Open an issue for conflicts
        if: steps.merge.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.merge.outputs.output }}
        run: |
          set -euo pipefail
          title="Spotifast merge needs a hand"
          body=$(printf 'The daily Spotifast sync hit conflicts. Run `scripts/sync-spotifast.sh` locally, resolve, commit and push main and spotifast-renamed.\n\n```\n%s\n```\n' "$OUTPUT")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
      - name: Fail loudly on any other problem
        if: steps.merge.outputs.status != '0' && steps.merge.outputs.status != '2'
        run: exit 1
