# Builds Spindle for Windows and macOS and publishes a GitHub release that
# Spindle's own updater (src/updates.rs, fastframe-update) reads:
#
#   spindle-v<version>-x86_64-pc-windows-msvc-setup.exe   the setup program
#   spindle-v<version>-x86_64-pc-windows-msvc.zip         portable exe
#   spindle-v<version>-macos-arm64.dmg                    Apple silicon Macs
#   checksums.txt                                         sha256 of each
#
# Beside those, the same files under plain names for people downloading by
# hand, without a version so /releases/latest/download/<name> always works:
#
#   Spindle-Setup.exe             Spindle-Windows-Portable.zip
#   Spindle-Mac.dmg
#
# The updater matches assets by exact name (fastframe-update's release.rs),
# so the updater's names above must never change; the plain copies are
# extra, and GitHub shows each file under a label set at upload.
#
# The Windows build is cross compiled from Linux with Zig, exactly as the
# repository's CLAUDE.md describes, so the exe here is the one tested on
# Nick's PC. The names say "msvc" because that is the target name the
# updater looks for on Windows, whatever toolchain linked the exe.
#
# Runs on a v* tag, or by hand (the Spotifast sync workflow dispatches it
# after a merge, since a tag pushed with the workflow token starts nothing).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (v1.2.3). Created on main if missing."
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Resolve the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" -m "Spindle ${tag#v}"
              git push origin "$tag"
            fi
          fi
          version="${tag#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$cargo_version" != "$version" ]; then
            echo "Cargo.toml says $cargo_version but the tag is $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (cross compiled with Zig)
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu
      - name: Install Zig and cargo-zigbuild
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - name: Build spindle.exe
        run: cargo zigbuild --locked --release --no-default-features --target x86_64-pc-windows-gnu
      - name: Build the setup program
        working-directory: installer
        env:
          SPINDLE_EXE: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/spindle.exe
        run: cargo zigbuild --release --target x86_64-pc-windows-gnu
      - name: Name the files for the updater
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          stem="spindle-v$VERSION-x86_64-pc-windows-msvc"
          cp installer/target/x86_64-pc-windows-gnu/release/spindle-setup.exe "dist/$stem-setup.exe"
          # The portable zip: the exe and the marker that keeps its data beside it.
          mkdir -p "portable/$stem"
          cp target/x86_64-pc-windows-gnu/release/spindle.exe "portable/$stem/"
          cp packaging/spindle-portable.txt "portable/$stem/" 2>/dev/null || echo "spindle-portable-v1" > "portable/$stem/spindle-portable.txt"
          cp README.md LICENSE "portable/$stem/"
          (cd portable && zip -qr "../dist/$stem.zip" "$stem")
          # The plain names people download by hand.
          cp "dist/$stem-setup.exe" dist/Spindle-Setup.exe
          cp "dist/$stem.zip" dist/Spindle-Windows-Portable.zip
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    name: macOS (Apple silicon)
    needs: tag
    runs-on: macos-latest
    # The Mac build is a bonus: a failure here does not stop the Windows
    # release. The job prints why, and the release notes say which files
    # made it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - name: Build Spindle
        run: cargo build --locked --release --no-default-features --target aarch64-apple-darwin
      - name: Bundle and make the disk image
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist payload
          packaging/macos/bundle.sh target/aarch64-apple-darwin/release/spindle "payload/Spindle.app" "$VERSION"
          ruby packaging/macos/dmg.rb payload "dist/spindle-v$VERSION-macos-arm64.dmg"
          cp "dist/spindle-v$VERSION-macos-arm64.dmg" dist/Spindle-Mac.dmg
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    name: Publish the release
    needs: [tag, windows, macos]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the files and write checksums.txt
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Write the release notes
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          TAG: ${{ needs.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/$TAG"
          {
            echo "Spindle is a fast, lightweight Spotify player for Windows and Mac, built to run next to a game without stutters."
            echo
            echo "## Download"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Windows** | [Spindle-Setup.exe]($base/Spindle-Setup.exe) |"
            echo "| Windows, no install | [Spindle-Windows-Portable.zip]($base/Spindle-Windows-Portable.zip) |"
            if [ -f dist/Spindle-Mac.dmg ]; then
              echo "| **Mac** (Apple silicon: M1 and newer) | [Spindle-Mac.dmg]($base/Spindle-Mac.dmg) |"
            fi
            echo
            echo "## Before you start"
            echo
            echo "- You need Spotify Premium. Spindle signs in through your browser the first time."
            echo "- **Windows:** setup installs for your account only, with no administrator prompt. Spindle is not code signed yet, so SmartScreen warns the first time: choose **More info**, then **Run anyway**. Start Spindle normally, not as administrator."
            echo "- **Mac:** drag Spindle into Applications. On first open macOS blocks it because it is not notarized yet: open **System Settings > Privacy & Security**, scroll down and choose **Open Anyway**. If macOS says Spindle is damaged, run \`xattr -dr com.apple.quarantine /Applications/Spindle.app\` in Terminal, then open it again."
            echo "- Spindle updates itself: it checks when it starts and offers the new version."
            echo
            echo "The files named \`spindle-v$VERSION-...\` and checksums.txt are what Spindle's built in updater downloads. You do not need them."
            echo
            echo "Spindle is not affiliated with Spotify."
          } > notes.md
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Each file with the label GitHub shows for it (file#label).
          files=()
          for f in dist/*; do
            name=$(basename "$f")
            case "$name" in
              Spindle-Setup.exe) label="Spindle for Windows (installer)";;
              Spindle-Windows-Portable.zip) label="Spindle for Windows (portable, no install)";;
              Spindle-Mac.dmg) label="Spindle for Mac (Apple silicon)";;
              *-setup.exe) label="Updater file: Windows installer";;
              *.zip) label="Updater file: Windows portable";;
              *.dmg) label="Updater file: Mac";;
              checksums.txt) label="Updater file: checksums";;
              *) label="$name";;
            esac
            files+=("$f#$label")
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md --draft=false --prerelease=false
          else
            gh release create "$TAG" "${files[@]}" --title "Spindle ${TAG#v}" --notes-file notes.md --latest
          fi
